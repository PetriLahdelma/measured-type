<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><style>
  main { inline-size: 300px; }
  p { font: 17px/1.6 Verdana, sans-serif; margin: 0 0 1em; }
</style></head>
<body><main>
<p>A narrow column holds the text, so no measure set on the paragraph can make its lines longer than the column allows, however wide the value is.</p>
<p>The solver has to say so rather than report a width that never took effect, because the reader still gets the short lines of the column itself.</p>
</main></body>
</html>
