<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spec 0029 U4: text faded by opacity</title>
<style>
  body { margin: 2rem; font: 18px/1.5 Georgia, serif; color: #1f1f1d; background: #fff; }
  .faded { color: #555; opacity: 0.6; }
</style>
</head>
<body>
<main>
<p class="faded">This paragraph is set in a dark grey that would pass on white, but the opacity on it fades it to a light grey that does not.</p>
</main>
</body>
</html>
