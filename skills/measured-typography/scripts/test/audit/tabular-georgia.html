<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tabular-georgia</title>
<style>
body { margin: 0; padding: 1rem; font: 16px/1.5 Georgia, serif; color: #1a1a1a; background: #fff; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
td { padding: 0.25rem 0.75rem; text-align: end; }
</style>
</head>
<body>
<table>
<tbody>
<tr><td>Rent</td><td>1 111</td></tr>
<tr><td>Power</td><td>808</td></tr>
<tr><td>Water</td><td>90</td></tr>
</tbody>
</table>
</body>
</html>
