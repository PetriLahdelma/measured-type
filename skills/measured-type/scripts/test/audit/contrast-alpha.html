<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>contrast over translucent grounds</title>
<style>
body { margin: 0; padding: 1rem; font: 18px/1.5 Georgia, serif; color: #222; background: #fff; }
code { padding: 0.1em 0.3em; color: rgb(4, 27, 35); background: rgba(87, 113, 100, 0.08); }
.veil { padding: 1rem; background: rgba(0, 0, 0, 0.3); }
.veil p { color: #777; }
</style>
</head>
<body>
<p class="ok">Inline <code>code on a faint tint</code> reads at about 15:1 once the tint is laid over the white page.</p>
<div class="veil"><p class="low">Grey text on a dark veil over white falls to about 2.1:1.</p></div>
</body>
</html>
