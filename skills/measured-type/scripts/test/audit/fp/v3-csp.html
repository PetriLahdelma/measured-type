<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The policy primer.style served on 3 November 2026: no script may run, inline or not. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>strict content security policy</title>
<style>
body { margin: 0; padding: 1rem; font: 18px/1.5 Georgia, serif; color: #222; background: #fff; }
main { max-inline-size: 34em; }
.low { color: #999; }
</style>
</head>
<body>
<main>
<p>Readers notice type only when it fails them: a line too long to follow back, leading so tight the lines blur, a heading that floats away from its text.</p>
<p class="low">This paragraph is set in a grey too light for its white ground, so the audit must still report it.</p>
</main>
</body>
</html>
