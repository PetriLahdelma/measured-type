<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spacing</title>
<style>
body { margin: 0; padding: 1rem; font: 18px/1.5 Georgia, serif; color: #222; background: #fff; }
.box { max-inline-size: 34em; block-size: 4.5em; overflow: hidden; line-height: 1.5; } .box p { margin: 0; }
</style>
</head>
<body>
<div class="box"><p>Three lines of text fit this box at its own leading. Under the WCAG text-spacing override the same words need more room, and a fixed height with hidden overflow cuts them off.</p></div>
</body>
</html>
