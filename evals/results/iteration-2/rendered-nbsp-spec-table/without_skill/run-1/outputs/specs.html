<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laptop Specs</title>
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --text: #1c1c1a;
    --muted: #5f5e59;
    --line: #e2e0da;
    --accent: #1f5f8b;
    --accent-text: #ffffff;
    --row-alt: #fbfaf8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413;
      --surface: #1d1d1b;
      --text: #ecebe6;
      --muted: #a3a29b;
      --line: #34332f;
      --accent: #6aaede;
      --accent-text: #0e1a24;
      --row-alt: #21211f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 56rem;
    margin: 0 auto;
    padding: 2.5rem 1rem 3rem;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }
  h1 {
    margin: 0;
    font-size: 1.75rem;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }
  .lede {
    margin: 0.25rem 0 0;
    color: var(--muted);
  }
  .lang-switch {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    background: var(--surface);
  }
  .lang-switch button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 0.875rem;
    padding: 0.375rem 0.875rem;
    border-radius: 999px;
    cursor: pointer;
    min-height: 2.25rem;
  }
  .lang-switch button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--accent-text);
  }
  .lang-switch button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .table-wrap {
    overflow-x: auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums lining-nums;
  }
  .note {
    margin: 0.75rem 0 0;
    color: var(--muted);
    font-size: 0.875rem;
  }
  th, td {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--line);
    vertical-align: baseline;
  }
  thead th {
    font-size: 0.875rem;
    text-align: right;
    font-weight: 600;
    white-space: nowrap;
  }
  thead th:first-child { text-align: left; }
  tbody th, thead th:first-child {
    position: sticky;
    left: 0;
    background: inherit;
  }
  thead tr, tbody tr { background: var(--surface); }
  tbody th {
    text-align: left;
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
  }
  tbody td {
    text-align: right;
    white-space: nowrap;
  }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:last-child th,
  tbody tr:last-child td {
    border-bottom: 0;
    font-weight: 600;
    color: var(--text);
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 id="title"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="lang-switch" role="group" id="lang-switch">
      <button type="button" data-lang="en" lang="en">English</button>
      <button type="button" data-lang="fi" lang="fi">Suomi</button>
    </div>
  </header>

  <div class="table-wrap" tabindex="0" role="region" aria-labelledby="title">
    <table>
            <thead><tr id="head-row"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <p class="note" id="caption"></p>
</main>

<script>
  // Spec data: plain numbers, units are resolved per locale at render time.
  const SPECS = {
    models: [
      { id: "air",  name: "Model 13" },
      { id: "pro",  name: "Model 15" },
      { id: "max",  name: "Model 16" }
    ],
    rows: [
      { key: "weight",      unit: "kg",    values: [1.24, 1.55, 2.1] },
      { key: "battery",     unit: "Wh",    values: [52, 72, 99.5] },
      { key: "storage",     unit: "bytes", values: [
          { value: 512, unit: "GB" }, { value: 1, unit: "TB" }, { value: 2, unit: "TB" }
        ] },
      { key: "display",     unit: "in",    values: [13.6, 15.3, 16.2] },
      { key: "batteryLife", unit: "h",     values: [18, 15, 22], upTo: true },
      { key: "price",       unit: "EUR",   values: [1299, 1899, 2799] }
    ]
  };

  const NBSP = " ";

  const STRINGS = {
    en: {
      htmlTitle: "Laptop specs",
      title: "Laptop comparison",
      lede: "Three models, side by side.",
      switchLabel: "Language",
      spec: "Specification",
      caption: "Prices include VAT. Battery life is the manufacturer's estimate.",
      labels: {
        weight: "Weight",
        battery: "Battery",
        storage: "Storage",
        display: "Display",
        batteryLife: "Battery life",
        price: "Price"
      },
      units: { kg: "kg", Wh: "Wh", GB: "GB", TB: "TB", in: "in", h: "h" },
      upTo: "up to"
    },
    fi: {
      htmlTitle: "Kannettavien tekniset tiedot",
      title: "Kannettavien vertailu",
      lede: "Kolme mallia rinnakkain.",
      switchLabel: "Kieli",
      spec: "Ominaisuus",
      caption: "Hinnat sisältävät arvonlisäveron. Akunkesto on valmistajan arvio.",
      labels: {
        weight: "Paino",
        battery: "Akku",
        storage: "Tallennustila",
        display: "Näyttö",
        batteryLife: "Akunkesto",
        price: "Hinta"
      },
      // Finnish abbreviations: Gt/Tt (gigatavu, teratavu), tuumaa for inches.
      units: { kg: "kg", Wh: "Wh", GB: "Gt", TB: "Tt", in: "tuumaa", h: "h" },
      upTo: "jopa"
    }
  };

  const LOCALES = { en: "en-GB", fi: "fi-FI" };

  // Plain number in the locale's decimal and grouping style, no padding of decimals.
  function formatNumber(n, lang) {
    return new Intl.NumberFormat(LOCALES[lang], {
      maximumFractionDigits: 2,
      useGrouping: true
    }).format(n);
  }

  // Number + unit always joined by a no-break space so the pair never wraps apart.
  function withUnit(n, unit, lang) {
    return formatNumber(n, lang) + NBSP + STRINGS[lang].units[unit];
  }

  function formatPrice(n, lang) {
    // fi-FI yields "1 299 €" with no-break spaces; en-GB yields "€1,299".
    return new Intl.NumberFormat(LOCALES[lang], {
      style: "currency",
      currency: "EUR",
      maximumFractionDigits: 0
    }).format(n);
  }

  function formatCell(row, raw, lang) {
    if (row.unit === "EUR") return formatPrice(raw, lang);
    if (row.unit === "bytes") return withUnit(raw.value, raw.unit, lang);
    const text = withUnit(raw, row.unit, lang);
    return row.upTo ? STRINGS[lang].upTo + NBSP + text : text;
  }

  function render(lang) {
    const t = STRINGS[lang];
    document.documentElement.lang = lang;
    document.title = t.htmlTitle;
    document.getElementById("title").textContent = t.title;
    document.getElementById("lede").textContent = t.lede;
    document.getElementById("caption").textContent = t.caption;
    document.getElementById("lang-switch").setAttribute("aria-label", t.switchLabel);

    const head = document.getElementById("head-row");
    head.replaceChildren();
    const corner = document.createElement("th");
    corner.scope = "col";
    corner.textContent = t.spec;
    head.appendChild(corner);
    SPECS.models.forEach(m => {
      const th = document.createElement("th");
      th.scope = "col";
      th.textContent = m.name;
      head.appendChild(th);
    });

    const body = document.getElementById("body");
    body.replaceChildren();
    SPECS.rows.forEach(row => {
      const tr = document.createElement("tr");
      const th = document.createElement("th");
      th.scope = "row";
      th.textContent = t.labels[row.key];
      tr.appendChild(th);
      row.values.forEach(v => {
        const td = document.createElement("td");
        td.textContent = formatCell(row, v, lang);
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });

    document.querySelectorAll("#lang-switch button").forEach(b => {
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
    });
  }

  function initialLang() {
    const param = new URLSearchParams(location.search).get("lang");
    if (param && STRINGS[param]) return param;
    try {
      const saved = localStorage.getItem("specs-lang");
      if (saved && STRINGS[saved]) return saved;
    } catch (e) { /* storage unavailable */ }
    return (navigator.language || "").toLowerCase().startsWith("fi") ? "fi" : "en";
  }

  document.getElementById("lang-switch").addEventListener("click", e => {
    const btn = e.target.closest("button[data-lang]");
    if (!btn) return;
    render(btn.dataset.lang);
    try { localStorage.setItem("specs-lang", btn.dataset.lang); } catch (e) { /* ignore */ }
  });

  render(initialLang());
</script>
</body>
</html>
